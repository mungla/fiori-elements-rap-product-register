# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: urapproductreg
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertError: true
        target:
          url:  https://your-system.example.com:44300
          client: '100'
        app:
          name: ZURAPRODREG
          description: URA Product Registration
          package: $TMP
          transport: ''
        exclude:
          - /test/
          - /localService/
